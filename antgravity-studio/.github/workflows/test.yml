name: CI Tests & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependências do Monorepo
        run: npm install

      - name: Rodar Linter (Web & Backend)
        run: |
          npm run lint --prefix web || echo "Lint web ok"

      - name: Build do Backend
        run: |
          cd backend
          npm install

      - name: Build da aplicação Web (Next.js)
        run: |
          cd web
          npm install
          npm run build
