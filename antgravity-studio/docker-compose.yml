version: '3.8'

services:
  # Servidor de Banco de Dados PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    container_name: antgravity_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antgravity_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antgravity_password}
      POSTGRES_DB: ${POSTGRES_DB:-antgravity_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - antgravity_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antgravity_user} -d ${POSTGRES_DB:-antgravity_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor de Cache e Filas Redis
  redis:
    image: redis:7-alpine
    container_name: antgravity_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - antgravity_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor Backend Express API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: antgravity_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-antgravity_user}:${POSTGRES_PASSWORD:-antgravity_password}@postgres:5432/${POSTGRES_DB:-antgravity_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-sua_chave_secreta_jwt_super_segura}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_CLOUD_API_KEY: ${GOOGLE_CLOUD_API_KEY}
      ANTGRAVITY_API_KEY: ${ANTGRAVITY_API_KEY}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - antgravity_network

networks:
  antgravity_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
